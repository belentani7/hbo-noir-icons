name: Noir Icons / Visual and data integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Catalogue and privacy contract
        run: npm run test
      - name: TypeScript
        run: npm run lint
      - name: Real production build
        run: npm run build
      - name: Check website entrypoint
        run: test -s dist/index.html
