name: Noir Icons / Visual and data integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Catalogue and privacy contract
        run: npm run test
      - name: TypeScript
        run: npm run lint
      - name: Real production build
        run: npm run build
      - name: Check website entrypoint
        run: test -s dist/index.html
